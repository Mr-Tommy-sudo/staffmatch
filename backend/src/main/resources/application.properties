spring.application.name=staffmatch
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/staffmatch}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:staffmatch}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:staffmatch-local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
max.bot-token=${MAX_BOT_TOKEN}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
python.base-url=${PYTHON_BASE_URL:http://localhost:8000}
